name: Instano
options:
  bundleIdPrefix: com.xaviernishikawa
  deploymentTarget:
    iOS: "17.0"
targets:
  Instano:
    type: application
    platform: iOS
    sources:
      - path: Instano
        excludes: ["Resources/**"]
      - path: Instano/Resources
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.xaviernishikawa.instano
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_CFBundleDisplayName: Freely
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 47BX55MGYF
        CURRENT_PROJECT_VERSION: 4
        MARKETING_VERSION: "1.0"
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_NSCameraUsageDescription: "Take photos and videos to post to your feed."
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "Record audio when capturing video for a post."
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: "Choose photos and videos from your library to post."
  InstanoTests:
    type: bundle.unit-test
    platform: iOS
    sources: [InstanoTests]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: Instano
schemes:
  Instano:
    build:
      targets:
        Instano: all
        InstanoTests: [test]
    test:
      targets: [InstanoTests]
